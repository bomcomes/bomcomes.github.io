<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f55d73" />
    <meta
      name="description"
      content="소중한 하루를 기록하는 봄 다이어리를 만나보세요."
    />
    <meta property="og:title" content="봄 다이어리" />
    <meta
      property="og:description"
      content="소중한 하루를 기록하는 나만의 일기장"
    />
    <meta
      property="og:image"
      content="https://bomcomes.com/bomdiary/invite/app-icon.png"
    />
    <meta property="og:url" content="https://bomcomes.com/bomdiary/invite" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://bomcomes.com/bomdiary/invite" />
    <link rel="icon" href="./app-icon.png" />
    <title>봄 다이어리</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        color: #25252a;
        background:
          radial-gradient(circle at 50% 18%, #fff 0 16%, transparent 42%),
          linear-gradient(160deg, #fff8f6 0%, #fff 48%, #fff3f6 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Noto Sans KR", sans-serif;
      }

      main {
        width: calc(100vw - 40px);
        max-width: 430px;
        text-align: center;
      }

      .app-icon {
        display: block;
        width: 168px;
        height: 168px;
        margin: 0 auto 18px;
        border-radius: 38px;
        box-shadow: 0 18px 50px rgb(178 59 82 / 14%);
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 40px);
        line-height: 1.25;
        letter-spacing: -0.04em;
      }

      .tagline {
        margin: 12px 0 0;
        color: #6e6e78;
        font-size: 17px;
        line-height: 1.65;
        letter-spacing: -0.02em;
      }

      .store-buttons {
        display: grid;
        gap: 12px;
        margin-top: 34px;
      }

      .store-button {
        display: flex;
        min-height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        color: #fff;
        background: #17171a;
        font-size: 16px;
        font-weight: 650;
        text-decoration: none;
        transition: transform 140ms ease, background 140ms ease;
      }

      .store-button:hover {
        background: #2a2a2f;
        transform: translateY(-1px);
      }

      .store-button:focus-visible {
        outline: 3px solid rgb(245 93 115 / 35%);
        outline-offset: 3px;
      }

      .store-button img {
        width: 24px;
        height: 24px;
        margin-right: 10px;
      }

      footer {
        margin-top: 32px;
        color: #a0a0a8;
        font-size: 13px;
      }

      [data-lang="en"] {
        display: none;
      }

      html[lang="en"] [data-lang="ko"] {
        display: none;
      }

      html[lang="en"] [data-lang="en"] {
        display: inline;
      }

      @media (max-height: 620px) {
        body {
          align-items: flex-start;
        }

        .app-icon {
          width: 128px;
          height: 128px;
          border-radius: 30px;
        }
      }
    </style>
    <script>
      if (!navigator.language.toLowerCase().startsWith("ko")) {
        document.documentElement.lang = "en";
        document.title = "Bom Diary";
      }
    </script>
  </head>
  <body>
    <main>
      <img class="app-icon" src="./app-icon.png" alt="" />
      <h1>
        <span data-lang="ko">봄 다이어리</span>
        <span data-lang="en">Bom Diary</span>
      </h1>
      <p class="tagline">
        <span data-lang="ko">소중한 하루를 기록하는<br />나만의 일기장</span>
        <span data-lang="en">Your private space for<br />everyday moments</span>
      </p>

      <div class="store-buttons">
        <a
          class="store-button"
          href="https://apps.apple.com/app/apple-store/id1502873903?pt=119969822&amp;ct=bomdiary_invite&amp;mt=8"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="./icon_apple.png" alt="" />
          <span data-lang="ko">App Store에서 다운로드</span>
          <span data-lang="en">Download on the App Store</span>
        </a>
        <a
          class="store-button"
          href="https://play.google.com/store/apps/details?id=com.bomcomes.diary&amp;referrer=utm_source%3Dbomdiary_invite%26utm_medium%3Dreferral%26utm_campaign%3Dinvite"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="./icon_google.png" alt="" />
          <span data-lang="ko">Google Play에서 다운로드</span>
          <span data-lang="en">Get it on Google Play</span>
        </a>
      </div>

      <footer>© bomcomes. All rights reserved.</footer>
    </main>
  </body>
</html>
